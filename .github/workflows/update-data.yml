name: Update surveillance data

on:
  push:
    paths:
      - "scripts/update_events.py"
      - "data/import/**"
      - ".github/workflows/update-data.yml"
  repository_dispatch:
    types:
      - new-surveillance-report
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: surveillance-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh public surveillance feeds
        run: python scripts/update_events.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/events.json data/events.js data/source-status.json data/import-validation.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/events.js data/source-status.json data/import-validation.json
          git commit -m "Update surveillance data"
          git push

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
